name: WorkPulse
options:
  bundleIdPrefix: com.workpulse
  deploymentTarget:
    macOS: "14.0"
packages:
  WorkPulseNative:
    path: .
targets:
  WorkPulse:
    type: application
    platform: macOS
    sources:
      - Sources/WorkPulseMenuBar
      - Resources/WorkPulseAssets.xcassets
    dependencies:
      - package: WorkPulseNative
        product: WorkPulseCore
      - target: WorkPulseWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workpulse.prototype
        PRODUCT_NAME: WorkPulse
        INFOPLIST_FILE: Xcode/HostInfo.plist
        CODE_SIGN_ENTITLEMENTS: Xcode/WorkPulse.entitlements
        CODE_SIGN_STYLE: Automatic
        WORKPULSE_APP_GROUP: "$(DEVELOPMENT_TEAM).com.workpulse.shared"
        CURRENT_PROJECT_VERSION: 23
        MARKETING_VERSION: 0.3.1
        SWIFT_VERSION: 6.0
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  WorkPulseWidget:
    type: app-extension
    platform: macOS
    sources:
      - WidgetExtension/WorkPulseWidget.swift
      - Resources/WorkPulseAssets.xcassets
    dependencies:
      - package: WorkPulseNative
        product: WorkPulseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workpulse.prototype.widgets
        PRODUCT_NAME: WorkPulseWidget
        INFOPLIST_FILE: Xcode/WidgetInfo.plist
        CODE_SIGN_ENTITLEMENTS: Xcode/WorkPulseWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        WORKPULSE_APP_GROUP: "$(DEVELOPMENT_TEAM).com.workpulse.shared"
        CURRENT_PROJECT_VERSION: 23
        MARKETING_VERSION: 0.3.1
        SWIFT_VERSION: 6.0
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
schemes:
  WorkPulse:
    build:
      targets:
        WorkPulse: all
    run:
      config: Debug
    archive:
      config: Release
